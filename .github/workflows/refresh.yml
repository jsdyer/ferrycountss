name: Refresh Halifax boarding records
on:
  schedule:
    - cron: '43 11 * * 3'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/refresh.py', '.github/workflows/refresh.yml']
concurrency:
  group: ferry-data
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  snapshot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - run: python3 scripts/refresh.py
      - run: python3 scripts/build.py
      - name: Publish validated updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git diff --quiet -- web/data; then
            git add web/data
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh ferry boarding records'
            git push origin HEAD:main
            gh workflow run pages.yml --ref main
          elif [ "${GITHUB_RUN_ATTEMPT}" -gt 1 ]; then
            gh workflow run pages.yml --ref main
          fi
